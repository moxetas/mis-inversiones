# Descarga cada media hora las noticias en español de TradingView para la pestaña Noticias de la app.
# Las publica en la rama «noticias» (un solo commit que se sobrescribe), así no llena de commits la rama main.
name: Noticias

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: true

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Descargar noticias
        run: python3 scripts/noticias.py noticias.json

      - name: Publicar en la rama «noticias»
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir publicar && mv noticias.json publicar/ && cd publicar
          git init -q -b noticias
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git commit -qm "Noticias $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" noticias
